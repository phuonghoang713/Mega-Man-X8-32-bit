; Optional settings for Zero's custom sprites. See README.md in this folder.
; Only used once zero.json + zero.png are present.

[sprite]

; Extra shift for every frame, in pixels, applied after Zero's feet are lined
; up with X's automatically. Example: Vector2( 0, -2 ) moves Zero 2 px up.
offset=Vector2( 0, 0 )

[saber]

; true: draw the code-generated slash trail over the sprites.
; false: the saber animations already include the slash.
procedural_trail=true

; Frame (counting from 0) of each saber animation on which the hit lands.
; Delete a line to use the default timing from ZSaber.gd instead.
hit_frame_saber_1=2
hit_frame_saber_2=2
hit_frame_saber_3=3
hit_frame_saber_air=1
hit_frame_saber_dash=1
